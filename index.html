<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift Schedule</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231F4E8C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6.5 16.5a5.5 5.5 0 0 1 11 0z'/%3E%3Cpath d='M4 19.5h16'/%3E%3Cpath d='M12 4v2.4M5.6 7.2l1.6 1.6M18.4 7.2l-1.6 1.6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF0F4;--sf:#fff;--ink:#14202E;--mu:#5C6B7C;--ln:#D8DEE6;--ac:#1F4E8C;--onac:#fff;--off:#8795A6;
--c0:#C98200;--c1:#8E3FC4;--c2:#4B4FBF;--c3:#1E8E5A;--c4:#0F8B8D;--c5:#B03A7A;--c6:#D9531E;--c7:#C62F3A;
--bar:#2F6BBF;--pos:#17784C;--neg:#C62F3A;--due:#B0400F;
color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0F1620;--sf:#18212D;--ink:#E8EDF3;--mu:#92A1B3;--ln:#2A3646;--ac:#6FA3E8;--onac:#0B1626;--off:#6B7A8C;
--c0:#F0B429;--c1:#C08BF0;--c2:#8F93F5;--c3:#44C58A;--c4:#3CC4C6;--c5:#E36FAE;--c6:#FF8A5B;--c7:#FF6B73;
--bar:#5189D4;--pos:#44C58A;--neg:#FF6B73;--due:#FF8A5B;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0F1620;--sf:#18212D;--ink:#E8EDF3;--mu:#92A1B3;--ln:#2A3646;--ac:#6FA3E8;--onac:#0B1626;--off:#6B7A8C;
--c0:#F0B429;--c1:#C08BF0;--c2:#8F93F5;--c3:#44C58A;--c4:#3CC4C6;--c5:#E36FAE;--c6:#FF8A5B;--c7:#FF6B73;
--bar:#5189D4;--pos:#44C58A;--neg:#FF6B73;--due:#FF8A5B;
color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif;
padding:env(safe-area-inset-top,0px) 0 calc(86px + env(safe-area-inset-bottom,0px))}
main{max-width:540px;margin:0 auto;padding:10px 16px;position:relative}
main>h1:first-child,main>.seg:first-child,main>.mhead:first-child{padding-right:52px}
h1{font:700 28px/1.1 'Barlow Condensed',system-ui,sans-serif;margin:0 0 10px}
h2{font:600 19px/1.2 'Barlow Condensed',system-ui,sans-serif;margin:0 0 8px}
h3{font:600 15px/1.2 Barlow,system-ui,sans-serif;margin:14px 0 4px}
p{margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);
border-radius:9px;padding:9px;width:100%;min-width:0}
.btn{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ln)}
.btn.sm{padding:10px 13px;min-height:44px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{align-self:stretch}
/* one field per line: side by side is too tight on a phone */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;margin-top:10px}
.form .full{grid-column:1/-1}
.form>div{min-width:0}
.form input,.form select{max-width:100%}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}
label .mu{font-size:11.5px;opacity:.75;margin-left:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mhead button{width:40px;height:44px;flex:none;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:20px}
.mhead h1{margin:0;flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mu);padding:2px 0}
.cell{min-height:74px;border:1px solid var(--ln);border-radius:9px;background:var(--sf);
padding:3px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.1;overflow:hidden}
.cell .d{font-weight:600;font-size:13px}
.cell .ic{font-size:15px;min-height:17px;letter-spacing:-1px}
.cell .ba{display:flex;gap:2px;min-height:0}
.cell .nt{font-size:11px;line-height:1.1;color:var(--mu);text-align:center;max-width:100%;
overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cell.w{background:color-mix(in srgb,var(--c) 15%,var(--sf));border-color:color-mix(in srgb,var(--c) 55%,var(--ln))}
.cell.ovr{border-style:dashed;border-width:2px}
.cell.today .d{background:var(--ink);color:var(--sf);border-radius:20px;padding:0 6px}
.cell.sel{outline:2px solid var(--ac);outline-offset:1px}
.cell:disabled{cursor:default;color:var(--ink)}
.ib{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;
background:var(--sf);border:1.5px solid var(--c);font-size:10px;font-style:normal;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:13px;color:var(--mu);margin:10px 2px}
.legend span{display:flex;align-items:center;gap:4px}
.ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.ev .ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
background:var(--sf);border:2px solid var(--c)}
.ev .t{flex:1;min-width:0}
.ev .x{background:none;border:0;color:var(--mu);flex:none;width:44px;height:44px;display:grid;place-items:center}
.ev .x svg{width:16px;height:16px}
.ev .btn{flex:none}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.cd div{background:var(--bg);border-radius:10px;padding:8px 0;text-align:center}
.cd b{display:block;font:700 32px/1 'Barlow Condensed',system-ui,sans-serif}
.cd small{color:var(--mu);font-size:12px}
.big{font:700 40px/1 'Barlow Condensed',system-ui,sans-serif;margin:2px 0 6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.kv:first-of-type{border-top:0}.kv b{white-space:nowrap}
.kv.tot{border-top:2px solid var(--ln);font-size:17px}
.pc{width:48px;height:56px;flex:none;border-radius:10px;border:1px solid var(--ln);background:var(--sf);
font-size:12px;line-height:1.2;color:var(--mu);padding:2px}
.pc.on{background:color-mix(in srgb,var(--c) 20%,var(--sf));border-color:var(--c);border-width:2px}
.pc span{display:block;font-size:17px}
.sw{display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;font-size:15px}
.sw input{width:auto;flex:none;margin-top:3px}
.av{width:38px;height:38px;flex:none;border-radius:50%;background:var(--ln);object-fit:cover}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .btn{flex:1;padding:9px 6px;font-size:14px}
.tb{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tb button{background:none;border:0;padding:8px 0;font-size:11px;color:var(--mu);
display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.tb button span{font-size:20px}.tb button.on{color:var(--ac);font-weight:600}
.sws{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:400px}
.sws button{width:100%;aspect-ratio:1;height:auto;min-height:30px;border-radius:9px;border:2px solid transparent;background:var(--c)}
@media(max-width:339px){.sws{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sws button.on{border-color:var(--ink)}
.step{font:600 13px Barlow,system-ui,sans-serif;color:var(--ac);margin-bottom:2px}
.ag{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--ln);width:100%;
background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:flex-start;color:inherit}
.ag.on{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.ag .ab{flex:1;min-width:0;line-height:1.5}
.wk{font:600 12px Barlow,system-ui,sans-serif;color:var(--mu);padding:12px 0 2px;
border-top:1px solid var(--ln);margin-top:4px}
.wk:first-child{border-top:0;margin-top:0;padding-top:0}
.agp{border-top:0;margin-top:0}
.agp>summary{color:var(--mu);font:600 12px Barlow,system-ui,sans-serif;letter-spacing:.07em;
text-transform:uppercase;padding:2px 0 6px}
.agp>summary .mu{text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px;font-size:13px}
.agp[open]{border-bottom:1px solid var(--ln);margin-bottom:4px;padding-bottom:6px}
.inl{margin:0 -14px;padding:2px 14px 6px;background:var(--bg)}
.inl .card{margin-bottom:8px}
.lgd{border-top:0;margin-top:6px}
.lgd>summary{padding:6px 0 2px;font-size:14px}
.lgd .legend{margin-top:4px}
.tg{display:grid;grid-template-columns:minmax(70px,1fr) repeat(7,minmax(0,34px));
gap:3px;align-items:center;margin-top:4px}
.th{text-align:center;font-size:11px;color:var(--mu);line-height:1.1;padding-bottom:2px}
.th small{display:block;font-size:10px}
.th.now{color:var(--ac);font-weight:700}
.tn{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;padding:2px 0}
.tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av2{width:20px;height:20px;flex:none;border-radius:50%;background:var(--ln);object-fit:cover}
.tc{height:36px;border:1px solid var(--ln);border-radius:7px;background:var(--sf);
display:grid;place-items:center;padding:0;color:var(--mu)}
.tc.on{background:color-mix(in srgb,var(--c) 18%,var(--sf));border-color:color-mix(in srgb,var(--c) 55%,var(--ln));color:var(--c)}
.tc.off{background:color-mix(in srgb,var(--c) 14%,var(--sf));border-color:color-mix(in srgb,var(--c) 45%,var(--ln));color:var(--c)}
.tc.awy{background:color-mix(in srgb,var(--c) 12%,var(--sf));border:2px dashed color-mix(in srgb,var(--c) 60%,var(--ln));color:var(--c)}
.tc svg{width:15px;height:15px}
.ag .dt{width:52px;flex:none;text-align:center}
.ag .dt b{display:block;font:700 20px/1 'Barlow Condensed',system-ui,sans-serif}
.ag .dt small{color:var(--mu);font-size:11px}
.ag.tdy .dt b{color:var(--ac)}
.warn{background:color-mix(in srgb,var(--c6) 12%,var(--sf));border-color:var(--c6)}
.hero{font:700 clamp(38px,11.5vw,50px)/1 'Barlow Condensed',system-ui,sans-serif;margin:1px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:14px;margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.stats.t3{grid-template-columns:repeat(3,1fr)}
.st{background:var(--bg);border-radius:11px;padding:10px 11px}
.st b{display:block;font:700 23px/1.05 'Barlow Condensed',system-ui,sans-serif}
.st small{display:block;color:var(--mu);font-size:12px;line-height:1.25;margin-top:2px}
details{border-top:1px solid var(--ln);margin-top:12px}
details>summary{cursor:pointer;padding:11px 0 3px;font:600 15px Barlow,system-ui,sans-serif;list-style:none;color:var(--ac)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'  \203A';color:var(--mu)}
details[open]>summary::after{content:'  \2304'}
.yr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.yr b{font:700 22px 'Barlow Condensed',system-ui,sans-serif;min-width:64px;text-align:center}
.yr button{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:18px}
.yr button[disabled]{opacity:.35}
.ch{width:100%;height:auto;display:block;margin-top:4px;touch-action:manipulation}
.ch line{stroke:var(--ln);stroke-width:1}
.ch path{fill:var(--bar)}
.ch text{fill:var(--mu);font:500 10px Barlow,system-ui,sans-serif}
.ch text.val{fill:var(--ink);font-weight:700;font-size:11px}
.gap{color:var(--mu);font-size:14px}
.gap b.ok{color:var(--pos)}.gap b.off{color:var(--neg)}
.map{display:inline-flex;align-items:center;gap:5px;margin-top:4px;color:var(--ac);
font-size:14px;text-decoration:none;min-height:34px}
.map svg{width:15px;height:15px;flex:none}
.map span{text-decoration:underline;text-underline-offset:2px}
.sheet{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:flex-end;
justify-content:center;bottom:calc(56px + env(safe-area-inset-bottom,0px))}
body.hasub .sheet{bottom:var(--ubh,118px)}
.sheet .bd{position:absolute;inset:0;background:rgba(8,14,22,.22);animation:fade .18s ease-out}
.sh{position:relative;width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;
background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.3);
animation:up .22s cubic-bezier(.2,.8,.3,1);max-height:92%;overflow:hidden}
@supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
 .sh{background:color-mix(in srgb,var(--bg) 62%,transparent);
  -webkit-backdrop-filter:blur(6px) saturate(1.35);backdrop-filter:blur(6px) saturate(1.35)}
 .shh{background:color-mix(in srgb,var(--sf) 70%,transparent)}
 .sh .card{background:color-mix(in srgb,var(--sf) 87%,transparent)}
 .sh .st,.sh input,.sh select,.sh textarea{background:color-mix(in srgb,var(--bg) 92%,transparent)}
}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.shh{position:relative;flex:none;display:flex;align-items:flex-start;gap:6px;
padding:14px 8px 8px 16px;border-bottom:1px solid var(--ln);background:var(--sf);border-radius:18px 18px 0 0}
.sht{flex:1;min-width:0}
.sht h2{margin:0}
.sht .sub{display:block;font-size:13px;margin-top:2px;line-height:1.35;color:var(--mu)}
.sht .sub .lg{vertical-align:-2px}
.sht .dl{display:block;margin-top:2px}
.sht .dl:first-child{margin-top:0}
.shh .x{background:none;border:0;color:var(--mu);width:44px;height:44px;flex:none;display:grid;place-items:center;margin-top:-4px}
.shh .x svg{width:18px;height:18px}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;
border-radius:3px;background:var(--ln)}
.shb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 16px}
.shb .card:last-of-type{margin-bottom:0}
body.lock{overflow:hidden}
.qrbox{background:#fff;border-radius:14px;padding:8px;margin:2px auto 10px;width:100%;max-width:272px;box-sizing:border-box}
.qrbox svg{display:block;width:100%;height:auto}
.qra{display:flex;flex-direction:column;gap:8px}.qra .btn{width:100%}
.qrn{text-align:center;margin:0 0 6px;font-size:17px}
.qrw{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.btn.qrb{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.qrb svg{width:20px;height:20px}
.ub{position:fixed;left:10px;right:10px;z-index:30;display:flex;align-items:center;gap:8px;
bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);
max-width:520px;margin:0 auto;font-size:14px}
.ub .t{flex:1;min-width:0}
.ub .btn{background:var(--bg);color:var(--ink);min-height:38px;padding:8px 14px}
.ub .x{background:none;border:0;color:var(--bg);width:38px;height:38px;
display:grid;place-items:center;opacity:.8}
.ub .x svg{width:16px;height:16px}
.kv b.pos{color:var(--pos)}.kv b.neg{color:var(--neg)}
b.pos{color:var(--pos)}b.neg{color:var(--neg)}
.hero.off{color:var(--neg)}
input[type=file]{padding:8px;background:var(--bg)}
.err{color:var(--neg);font-size:14px;font-weight:600}
.ok{color:var(--pos);font-size:14px;font-weight:600}
svg{display:block}
.tb .ti svg{width:21px;height:21px}
.ev .ic svg{width:19px;height:19px;color:var(--c)}
.ib svg{width:12.5px;height:12.5px}
.ib{color:var(--c)}
.cell .ic svg{width:17px;height:17px;color:var(--c)}
.mo{margin-bottom:6px}
/* the month name and weekday letters stay on top while that month scrolls by */
/* Month / Agenda stays reachable: pinned to the top while the months scroll under it */
.calbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin:-6px 0 4px}
.calbar .thb{position:static;flex:none;align-self:center}
.calbar .seg{margin:0;flex:1;min-width:0}
.cbr{display:flex;gap:6px;align-items:stretch}
.keyb{flex:none;padding:9px 12px}
.kr{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--ln);font-size:15px}
.kr:first-of-type{border-top:0}
.ks{flex:none;width:46px;display:grid;place-items:center}
.kc{width:42px;height:42px;border:1px solid var(--ln);border-radius:9px;background:var(--sf);display:grid;place-items:center;overflow:hidden}
.kc.w{background:color-mix(in srgb,var(--c) 15%,var(--sf));border-color:color-mix(in srgb,var(--c) 55%,var(--ln))}
.kc.w svg{width:18px;height:18px;color:var(--c)}
.kc.ovr{border-style:dashed;border-width:2px}
.kofd{font-size:10px;letter-spacing:.6px;color:var(--mu)}
.kofr{font-size:9px;color:var(--mu);line-height:1}
.ksn{font-size:9.5px;line-height:1.1;display:block;max-width:40px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kun{font-size:8.5px;letter-spacing:.3px;color:var(--mu);display:block}
.kc .ksn+.kun{margin-top:1px}
.ktd{background:var(--ink);color:var(--sf);border-radius:20px;padding:0 6px;font-size:13px}
.knt{font-size:10px;color:var(--mu)}
.mt{position:sticky;top:var(--cb,56px);z-index:3;background:var(--bg);padding:10px 0 4px;margin:0 -2px;padding-left:2px;padding-right:2px}
.mt h2{font:700 24px/1.1 'Barlow Condensed',system-ui,sans-serif;margin:0 0 6px}
.mt .grid{margin:0}
.moe{justify-content:center;margin:2px 0 4px}
.tdyb{position:fixed;left:50%;transform:translateX(-50%);z-index:12;bottom:calc(66px + env(safe-area-inset-bottom,0px));
 background:var(--ac);color:var(--onac);border:0;border-radius:999px;padding:10px 20px;min-height:44px;font-weight:600;
 box-shadow:0 4px 14px rgba(0,0,0,.22)}
body.hasub .tdyb,body.lock .tdyb{display:none}
.xm{margin-top:0;border-top:1px solid var(--ln)}
.xm>summary{display:flex;align-items:center;gap:10px;color:var(--ink);padding:10px 0;font-weight:400}
.xm>summary::after{content:'\203A';color:var(--mu);font-size:18px;margin-left:2px}
.xm[open]>summary::after{content:'\2304'}
.xmn{flex:1;min-width:0;line-height:1.3}
.xw{color:var(--due)}.xp{color:var(--pos)}
.xe{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-top:1px dashed var(--ln);
 padding:9px 0 9px 4px;text-align:left;color:var(--ink);min-height:48px}
.xet{flex:1;min-width:0;line-height:1.3}
.xea{flex:none;text-align:right;line-height:1.2}
.xea small{display:block;font-size:12px;font-weight:600}
/* the shift's own name, and under it the unit: both small enough to sit under the icon */
.cell .sn{font-size:10px;font-weight:700;line-height:1.15;color:var(--ink);max-width:100%;overflow:hidden;text-align:center;

const premRate=w=>{if(!w)return 0;
 return w.mode==='pct'?num(S.rates.base)*num(w.rate)/100:num(w.rate)};
const recentWho=()=>[...new Set(S.banks.flatMap(b=>b.entries.map(e=>(e.who||'').trim()))
 .filter(Boolean))].slice(0,12);
const recentLocs=()=>{const rows=S.events.filter(e=>e.loc).map(e=>({d:e.date,l:e.loc}));
 Object.keys(S.notes||{}).forEach(d=>(Array.isArray(S.notes[d])?S.notes[d]:[])
  .forEach(n=>{if(n&&n.loc)rows.push({d:d,l:n.loc})}));
 return[...new Set(rows.sort((a,b)=>String(b.d).localeCompare(String(a.d))).map(r=>r.l))].slice(0,10)};
function cdn(ms){const s=Math.floor(Math.max(0,ms)/1000);
 return[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}
function boxes(ms){return'<div class="cd" data-to="'+(Date.now()+ms)+'">'+cdn(ms).map((v,i)=>
 `<div><b>${pad(v)}</b><small>${['days','hrs','min','sec'][i]}</small></div>`).join('')+'</div>'}
const tib=(id,e)=>{const t=e?tyOf(e):tyDef(id);return`<i class="ib" style="--c:${colr(t.c)}">${ic(t.i)}</i>`};

/* ---------- setup ---------- */
function setupPat(){return W.pat||(W.pat=patOf(PREF[0][1]))}
function preHTML(act,cur){const j=(cur||[]).join('');
 return PRE.map(g=>`<h3>${esc(g[0])}</h3><div class="chips">${g[1].map(x=>
  `<button class="btn${x[1]===j?'':' ghost'} sm" data-a="${act}" data-i="${x[4]}">${esc(x[0])}</button>`).join('')}</div>`).join('')}
/* "4 on (2 Day, 2 Night), 4 off" — says what the cycle holds, so it can't be
   mistaken for the preset that happens to be called "4 on, 4 off" */
function cycleMix(p,shifts){
 const on=p.filter(x=>x!=='O').length,off=p.length-on,seen=[];
 p.forEach(l=>{if(l!=='O'&&seen.indexOf(l)<0)seen.push(l)});
 const parts=seen.map(l=>p.filter(x=>x===l).length+' '+esc((shiftDef(shifts,l)||{}).name||l));
 return `${on} on${seen.length>1?' ('+parts.join(', ')+')':''}, ${off} off`}
const ord=x=>x+((x%100>=11&&x%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[x%10]||'th'));
/* the other way today could line up, said the way a person would say it */
function fitLabel(today,fut){
 const p=setupPat(),want=W.was||'O',n=p.length;
 const hits=[];p.forEach((l,i)=>{if(l===want)hits.push(i)});
 if(hits.length<2)return'';
 const k0=((W.idx+1)%hits.length+hits.length)%hits.length,nxt=hits[k0];
 let k=1;for(let j=1;j<n;j++){if(p[(nxt-j+n)%n]===want)k++;else break}
 let runs=0;p.forEach((l,i)=>{if(l===want&&p[(i-1+n)%n]!==want)runs++});
 const nm=want==='O'?'day off':esc(((shiftDef(wShifts(),want)||{}).name||'shift').toLowerCase())+' shift';
 if(runs===1)return`No — ${today?'today is':fut?'that day is':'that was'} my ${ord(k)} ${nm}`;
 return`Not quite — try the next match (${k0+1} of ${hits.length})`}
function matchCount(){const p=setupPat(),w=W.was||'O';return p.filter(l=>l===w).length}
function setAnchor(){
 const p=setupPat(),want=W.was||'O';
 const hits=[];p.forEach((l,i)=>{if(l===want)hits.push(i)});
 if(!hits.length)return false;
 const i=hits[((W.idx%hits.length)+hits.length)%hits.length];
 const d=P(W.date);d.setDate(d.getDate()-i);
 W.anchor=ymd(d);return true;
}
function vSetup(){
 const p=setupPat(),on=p.filter(x=>x!=='O').length,tdy=ymd(new Date()),same=W.date===tdy;
 let h=`<h1>Set up your rotation</h1><p class="mu">Two steps and you're in. Everything can be changed later.</p>`;
 h+=`<div class="card"><div class="step">Step 1 of 2</div><h2>Pick your rotation</h2>
 <p class="mu" style="margin:0">The closest one is fine — you can change any day of it.</p>
 ${preHTML('wpre',p)}
 <p style="margin:6px 0 0"><b>${p.length}-day cycle</b> <span class="mu">· ${cycleMix(p,wShifts())}</span></p>
 <details${W.own?' open':''}><summary>Build it day by day</summary>
 <div class="form"><div class="full"><label>Cycle length in days (1 to 84)</label>
 <input id="wlen" type="number" min="1" max="84" value="${p.length}"></div></div>
 <p class="mu" style="margin:8px 0 0">Tap a day to change what you work on it.</p>
 <div class="chips">${p.map((l,i)=>{const d=shiftDef(wShifts(),l);
  return`<button class="pc${l!=='O'?' on':''}" style="--c:${d?colr(d.c):'var(--off)'}" data-a="wcyc" data-i="${i}" aria-label="Day ${i+1}, ${d?esc(d.name):'off'}">${i+1}<span>${d?ic(d.i):'–'}</span></button>`}).join('')}</div>
 </details></div>`;
 h+=`<div class="card"><div class="step">Step 2 of 2</div><h2>Line it up with your real week</h2>
 <p class="mu" style="margin:0">What ${same?'are you working today':'did you work on '+dl(P(W.date),{weekday:'long',month:'long',day:'numeric'})}?</p>
 <div class="chips">${wShifts().filter(x=>p.indexOf(x.id)>=0).map(x=>`<button class="btn${W.was===x.id?'':' ghost'} sm ico" data-a="wwas" data-k="${x.id}">${ic(x.i)} ${esc(x.name)}</button>`).join('')}
 <button class="btn${W.was==='O'?'':' ghost'} sm ico" data-a="wwas" data-k="O">${ic('dot')} Day off</button></div>`;
 if(W.was&&setAnchor()){
  const rot={pattern:p,anchor:W.anchor,shifts:wShifts()},n=matchCount();
  let pv='';for(let i=0;i<7;i++){const d=P(W.date);d.setDate(d.getDate()+i);
   const st=ymd(d),x=dayOf({rot,ov:{}},st);
   pv+=`<button class="pc${x?' on':''}" style="--c:${x?x.c:'var(--off)'}" disabled>${dl(d,{weekday:'short'})}<span>${x?ic(x.i):'–'}</span></button>`}
  h+=`<h3>${same?'Today and the next 6 days':'That day and the next 6'}</h3><div class="wk7">${pv}</div>
  <p class="mu" style="margin:0">Does this match your real schedule?</p>
  ${n>1?`<div class="chips"><button class="btn ghost sm" data-a="wnext">${fitLabel(same)}</button></div>`:''}`;
 }else if(W.was){
  h+=`<p class="err" style="margin:10px 0 0">Your cycle has no ${W.was==='O'?'days off':'shifts of that kind'} yet.
  Add one in step 1, or pick something else.</p>`;
 }else{h+=`<p class="mu" style="margin:0">Pick one and a preview of your week appears here.</p>`}
 h+=`<details><summary>Use a different day instead</summary>
 <div class="form"><div class="full"><label>Date</label>
 <input id="wdate" type="date" value="${W.date}"></div></div></details></div>`;
 const ok=W.was&&setAnchor();
 h+=`<div class="card"><button class="btn" style="width:100%" data-a="wdone"${ok?'':' disabled'}>${ok?'That’s my schedule — start':'Answer step 2 to start'}</button>
 <p class="mu" style="margin:8px 0 0">Pay, overtime, shift names and reminders are all on the Setup tab whenever you want them.</p></div>`;
 return h;
}

/* ---------- calendar ---------- */
function cellHTML(src,s,click){
 const dt=P(s),today=ymd(new Date());
 const x=dayOf(src,s),o=(src.ov||{})[s],
  evs=(src.events||[]).filter(e=>e.date===s),
  nt=click?noteTxt(s).concat(evs.filter(e=>e.note).map(e=>e.note)).filter(Boolean).join(' · '):'';
 let ba='';
 if(click&&isPay(s))ba+=chip('cash','var(--ac)');
 if(click&&isHol(s))ba+=chip('star','var(--c5)');
 ba+=evs.slice(0,3).map(e=>tib(e.type,e)).join('');
 const icon=x?ic(x.i):(o&&o.k==='off'?'<span class="offr">'+esc(o.r||'Off')+'</span>':'<span class="offd">OFF</span>');
 const lab=[dl(dt,{weekday:'long',day:'numeric',month:'long'}),
  x?(x.unit?x.unit+', ':'')+x.name+' '+tm(x.st)+' to '+tm(x.en):(o&&o.k==='off'?'off, '+(o.r||''):'day off'),
  click&&isPay(s)?'payday':'',click&&isHol(s)?'holiday':'',
  evs.map(e=>tyOf(e).name).join(', '),nt].filter(Boolean).join(', ');
 return`<button class="cell${x?' w':''}${x&&x.ovr||o?' ovr':''}${s===today?' today':''}${click&&s===sel?' sel':''}"
  aria-label="${esc(lab)}" ${click?`data-a="sel" data-d="${s}"`:'disabled'} ${x?`style="--c:${x.c}"`:''}>
  <span class="d">${dt.getDate()}</span><span class="ic">${icon}</span>${x?`<span class="sn">${esc(x.name)}</span>`:''}${x&&x.unit?`<span class="un">${esc(x.unit)}</span>`:''}<span class="ba">${ba}</span>
  ${nt?`<span class="nt">${esc(nt)}</span>`:''}</button>`;
}
function gridHTML(src,click,y,m,nodow){
 if(y==null){y=view.getFullYear();m=view.getMonth()}
 const wk=num(S.loc&&S.loc.wk),lead=(new Date(y,m,1).getDay()-wk+7)%7,L=dim(y,m);
 let c='';for(let i=0;i<lead;i++)c+='<i></i>';
 for(let d=1;d<=L;d++)c+=cellHTML(src,`${y}-${pad(m+1)}-${pad(d)}`,click);
 return`<div class="grid">${nodow?'':DOWN(wk).map(x=>`<div class="dow">${esc(x)}</div>`).join('')}${c}</div>`}
/* the month view is one long scroll: a few months back, a year ahead, more as you reach the end */
let MOB=1,MOA=4,CALJUMP=true;
const moId=(y,m)=>'mo-'+y+'-'+pad(m+1);
function monthList(){
 const n=new Date(),by=n.getFullYear(),bm=n.getMonth(),wk=num(S.loc&&S.loc.wk);
 /* whatever month is wanted must be in the list */
 const off=(view.getFullYear()-by)*12+(view.getMonth()-bm);
 if(-off>MOB)MOB=Math.min(60,-off);if(off>MOA)MOA=Math.min(60,off+2);
 const dows=DOWN(wk).map(x=>`<div class="dow">${esc(x)}</div>`).join('');
 let h=MOB<60?`<div class="chips moe"><button class="btn ghost sm" data-a="moearlier">Show earlier months</button></div>`:'';
 for(let k=-MOB;k<=MOA;k++){const d=new Date(by,bm+k,1),y=d.getFullYear(),m=d.getMonth();
  h+=`<section class="mo" id="${moId(y,m)}"><div class="mt"><h2>${esc(d.toLocaleDateString(undefined,{month:'long',year:'numeric'}))}</h2>
   <div class="grid">${dows}</div></div>${gridHTML(me(),true,y,m,true)}</section>`}
 h+=MOA<60?`<div id="mosent" class="chips" style="justify-content:center"><button class="btn ghost sm" data-a="molater">Show more months</button></div>`:'';
 return h}
/* after drawing: bring the wanted month to the top, and keep loading as the end comes near */
function barH(){const b=document.querySelector('.calbar');return b&&b.offsetHeight?b.offsetHeight:0}
function calAfter(){
 if(tab!=='cal'||cview!=='month'||!S.setup){tdyBtn(false);return}
 const bh=barH();if(bh)document.documentElement.style.setProperty('--cb',bh+'px');
 if(CALJUMP){CALJUMP=false;const e=document.getElementById(moId(view.getFullYear(),view.getMonth()));
  if(e){const top=e.getBoundingClientRect().top+window.scrollY-bh;window.scrollTo(0,Math.max(0,top))}}
 try{const s=document.getElementById('mosent');
  if(s&&window.IntersectionObserver){if(calAfter.io)calAfter.io.disconnect();
   calAfter.io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&MOA<60){MOA=Math.min(60,MOA+6);render()}},{rootMargin:'600px 0px'});
   calAfter.io.observe(s)}}catch(e){}
 tdyCheck()}
/* a "Today" button appears once this month has scrolled out of sight */
function tdyBtn(v){const b=document.getElementById('tdyb');if(b)b.hidden=!v}
function tdyCheck(){if(tab!=='cal'||cview!=='month'||!S.setup)return tdyBtn(false);
 const n=new Date(),e=document.getElementById(moId(n.getFullYear(),n.getMonth()));
 if(!e||!e.getBoundingClientRect)return tdyBtn(!!e);const r=e.getBoundingClientRect();
 tdyBtn(r.bottom<barH()+60||r.top>(window.innerHeight||800)-120)}
try{window.addEventListener('scroll',()=>{if(tdyCheck.f)return;tdyCheck.f=1;
 (window.requestAnimationFrame||setTimeout)(()=>{tdyCheck.f=0;tdyCheck()})},{passive:true})}catch(e){}

function legend(){
 return`<details class="lgd"><summary>What the symbols mean</summary><div class="legend">${S.rot.shifts.map(x=>`<span style="--c:${colr(x.c)}"><i class="lg">${ic(x.i)}</i> ${esc(x.name)}</span>`).join('')}
 ${S.types.map(t=>`<span>${tib(t.id)} ${esc(t.name)}</span>`).join('')}
 ${hasPaydays()?'<span>'+chip('cash','var(--ac)')+' Payday</span>':''}
 ${(S.hol.dates||[]).length?'<span>'+chip('star','var(--c5)')+' Holiday</span>':''}
 <span style="border:2px dashed var(--ln);border-radius:5px;padding:0 5px">Changed day</span></div></details>`}
function agRow(sd,dt){
 const today=ymd(new Date());
 const x=shiftOn(sd),o=S.ov[sd],evs=S.events.filter(e=>e.date===sd),nt=noteTxt(sd);
 /* a day that is only your usual rotation shift is not news, so it stays out */
 const extra=!!(evs.length||nt.length||o||isHol(sd)||isPay(sd));
 if(!extra&&sd!==today)return'';
 const lines=[];
 if(o&&o.k==='off')lines.push(`<b>Off</b> <span class="mu">${esc(o.r||'')}</span>`);
 else if(x)lines.push(`<span class="mu"><i class="lg" style="--c:${x.c}">${ic(x.i)}</i> ${esc(x.name)}, ${tm(x.st)}–${tm(x.en)}${x.ovr?' · changed':''}</span>`);
 else lines.push('<span class="mu">Day off</span>');
 const tags=[];
 if(isHol(sd))tags.push(chip('star','var(--c5)')+' Holiday');
 if(isPay(sd))tags.push(chip('cash','var(--ac)')+' Payday');
 if(tags.length)lines.push('<span class="mu">'+tags.join(' · ')+'</span>');
 evs.forEach(e=>lines.push(`${tib(e.type,e)} ${esc(tyOf(e).name)} <span class="mu">${evWhen(e)} · ${e.h} h · ${$$(payOf(e))}${e.note?' · '+esc(e.note):''}</span>${mapLink(e.loc)}`));
 noteList(sd).forEach(n=>lines.push(`<span class="mu">${chip('clipboard','var(--mu)')} ${
  esc(noteLine(n))}</span>${mapLink(n.loc)}`));
 let h=`<button class="ag${sd===today?' tdy':''}${sd===sel?' on':''}" data-a="sel" data-d="${sd}"
  aria-label="${esc((sd===today?'Today, ':'')+dl(dt,{weekday:'long',day:'numeric',month:'long'})+', '+lines.join(', ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' '))}">
  <span class="dt"><b>${dt.getDate()}</b><small>${sd===today?'today':dl(dt,{weekday:'short'})}</small></span>
  <span class="ab">${lines.join('<br>')}</span></button>`;
 return h;
}
function agenda(){
 const now=new Date(),wkOf=d=>ymd(weekStart(d));
 const thisW=wkOf(now),nextW=(()=>{const d=weekStart(now);d.setDate(d.getDate()+7);return ymd(d)})();
 let past='',pn=0;
 for(let i=30;i>=1;i--){const d=new Date(now);d.setDate(d.getDate()-i);
  const r=agRow(ymd(d),d);if(r){past+=r;pn++}}
 let h='';
 if(pn)h+=`<details class="agp" data-fold="agpast"${OPEN.agpast?' open':''}><summary>Earlier<span class="mu">${
  pn} day${pn===1?'':'s'} in the last 30</span></summary>${past}</details>`;
 let body='',n=0,other=0,lastW='';
 for(let i=0;i<agWeeks*7;i++){
  const d=new Date(now);d.setDate(d.getDate()+i);
  const sd=ymd(d),r=agRow(sd,d);if(!r)continue;
  if(i>0)other++;
  const w=wkOf(d);
  if(w!==lastW){lastW=w;
   body+=`<div class="wk">${w===thisW?'The rest of this week':w===nextW?'Next week'
    :'Week of '+dl(P(w),{month:'short',day:'numeric'})}</div>`}
  body+=r;n++;
 }
 h+=n?body:'';
 if(!other)h+=`<p class="mu" style="margin:14px 0 0">Nothing${n?' else':''} on for the next ${agWeeks} weeks. Your usual shifts and days off aren't listed here — only what's different.</p>`;
 const nav=[];
 if(agWeeks<52)nav.push(`<button class="btn ghost sm" data-a="agmore">Look ${
  agWeeks>=12?'6':'4'} weeks further</button>`);
 if(agWeeks>AGW0)nav.push(`<button class="btn ghost sm" data-a="agless">Show less</button>`);
 if(nav.length)h+=`<div class="chips" style="margin:12px 0 0">${nav.join('')}</div>`;
 if(other)h+=`<p class="mu" style="margin:8px 0 0">Looking ${agWeeks===52?'a year':agWeeks+' weeks'} ahead — only days with something different are listed.</p>`;
 return`<div class="card">${h}</div>`;
}
function vCal(){
 const seg=`<div class="seg">${[['month','Month'],['agenda','Agenda']].map(([k,n])=>
  `<button class="btn${cview===k?'':' ghost'}" data-a="cview" data-k="${k}">${n}</button>`).join('')}</div>`;
 return `<div class="calbar"><div class="cbr">${seg}<button class="btn ghost sm keyb" data-a="keyopen" aria-label="Legend: what the symbols mean">Legend</button>${apph()}</div></div>`+(cview==='agenda'?agenda()
  :'<p class="mu" style="margin:0 2px 2px">Tap a day to book it off, add extra work, or jot down a note.</p>'+monthList())}
/* the key: every symbol the calendar uses, with what it means, in a sheet you can open from any month */
let KEYOPEN=false;
function keyHTML(){
 const row=(sample,txt)=>`<div class="kr"><span class="ks">${sample}</span><span>${txt}</span></div>`;
 const cellS=(inner,cls,c)=>`<span class="kc${cls?' '+cls:''}"${c?` style="--c:${c}"`:''}>${inner}</span>`;
 const units=[...new Set([S.rot.unit].concat((S.plans||[]).map(p=>p.unit)).filter(Boolean))];
 let h=`<h3 style="margin-top:0">Your Shifts</h3>`+S.rot.shifts.map(x=>row(cellS(ic(x.i),'w',colr(x.c)),`<b>${esc(x.name)}</b> <span class="mu">${esc(x.from)}\u2013${esc(x.to)}</span>`)).join('');
 h+=row(cellS('<b class="kofd">OFF</b>'),'A day off on your rotation');
 h+=row(cellS('<span class="kofr">Vacation</span>','ovr'),'A day you booked off \u2014 it shows the reason');
 h+=row(cellS('','ovr'),'Dashed edge: changed from your usual rotation');
 const s0=S.rot.shifts[0];
 if(s0)h+=row(cellS(`<b class="ksn">${esc(s0.name)}</b>${units.length?`<span class="kun">${esc(units[0])}</span>`:''}`),'The shift\u2019s name'+(units.length?', and under it your unit':'')+' on that day');
 h+=row(cellS('<b class="ktd">'+new Date().getDate()+'</b>'),'Today');
 h+=row(cellS('<span class="knt">Mall</span>'),'A note or address you added');
 h+=`<h3>Extra Work</h3>`+S.types.map(t=>row(tib(t.id),esc(t.name))).join('');
 h+=`<h3>Other</h3>`+row(chip('cash','var(--ac)'),'Payday')+row(chip('star','var(--c5)'),'Statutory holiday');
 return h}

function dayLine(){
 if(!sel)return'';
 const x=shiftOn(sel),o=S.ov[sel],rot=letter(sel,rotFor(sel));
 const dst=x&&x.nom&&Math.abs(x.h-x.nom)>0.01;
 let line=x?`<i class="lg" style="--c:${x.c}">${ic(x.i)}</i> ${x.unit?esc(x.unit)+' \u00b7 ':''}${esc(x.name)}, ${tm(x.st)}–${tm(x.en)} (${x.h} h)`
  :(o&&o.k==='off'?`Off — ${esc(o.r||'changed')}`:'Day off');
 if(dst)line+=` · clocks change, ${x.h>x.nom?'an hour longer':'an hour shorter'}`;
 if(o)line+=` · changed from ${rot!=='O'?esc((shiftDef(rotFor(sel).shifts,rot)||{}).name||rot):'a day off'}`;
 return`${isPay(sel)?chip('cash','var(--ac)')+' Payday · ':''}${isHol(sel)?chip('star','var(--c5)')+' Holiday · ':''}${line}`;
}
function daySched(){
 /* the day's own status only — what is on it is listed right below, and tappable */
 return sel?`<span class="dl">${dayLine()}</span>`:'';
}

/* ---------- time off, renewals, what's ahead ---------- */
function offHours(sd){
 const R=rotFor(sd),x=dayOf({rot:R,ov:{}},sd);return x?x.h:0}
function leaveCalc(y){
 const t=ymd(new Date()),out={};
 const row=r=>out[r]||(out[r]={taken:0,booked:0,days:0,allow:num((offKind(r)||{}).allow)});
 offKinds().forEach(k=>row(k.name));
 Object.keys(S.ov).forEach(sd=>{
  if(String(sd).slice(0,4)!==String(y))return;
  const o=S.ov[sd];if(!o||o.k!=='off')return;
  const b=row(o.r||'Other'),h=offHours(sd);
  b.days++;if(sd<=t)b.taken+=h;else b.booked+=h});
 return out;
}
const hh=n=>(Math.round(n*10)/10)+' h';
function leaveRows(y,compact){
 const L=leaveCalc(y);
 const keys=Object.keys(L).filter(r=>L[r].allow>0||L[r].taken>0||L[r].booked>0)
  .sort((a,b)=>(L[b].allow-L[a].allow)||a.localeCompare(b));
 if(!keys.length)return '';
 return keys.filter(r=>!compact||L[r].allow>0).map(r=>{
  const v=L[r],used=v.taken+v.booked,left=v.allow-used,
   pa=v.allow>0?Math.min(100,v.taken/v.allow*100):0,
   pb=v.allow>0?Math.min(100-pa,v.booked/v.allow*100):0;
  return`<div class="lv"><div class="kv" style="border:0;padding:2px 0">
   <span><i class="lg" style="--c:${colr((()=>{const i=offKinds().findIndex(k=>k.name===r);return i<0?7:i*2+1})())}">${ic(offIcon(r))}</i> ${esc(r)}</span>
   <b class="${v.allow>0?(left<0?'neg':'pos'):''}">${v.allow>0?(left<0?hh(-left)+' over':hh(left)+' left'):hh(used)+' used'}</b></div>
   ${v.allow>0?`<div class="mtr"><i class="a" style="width:${pa.toFixed(1)}%"></i><i class="b" style="width:${pb.toFixed(1)}%"></i></div>`:''}
   <span class="mu">${hh(v.taken)} taken${v.booked?' \u00b7 '+hh(v.booked)+' booked':''}${v.allow>0?' of '+hh(v.allow):''} \u00b7 ${v.days} day${v.days===1?'':'s'}</span></div>`}).join('');
}
function relT(when,now){const m=Math.round((when-now)/6e4);
 if(m<0)return'overdue';
 if(m<60)return'in '+Math.max(1,m)+' min';
 if(m<2160)return'in '+Math.round(m/60)+' h';
 return'in '+Math.round(m/1440)+' days'}
function renDue(all){
 const now=new Date(),out=[];
 (S.ren||[]).forEach(r=>{
  const w=at(r.date,'09:00'),lead=(num(r.rem)||60)*864e5;
  if(!all&&w-now>lead)return;
  out.push({key:'r'+r.id,when:w,i:'shield',c:w<now?'var(--neg)':'var(--c5)',
   title:r.name,sub:(w<now?'Expired ':'Expires ')+dl(w,{year:'numeric',month:'short',day:'numeric'})})});
 return out.sort((a,b)=>a.when-b.when);
}
function aheadList(){
 const now=new Date(),t=ymd(now),out=[];
 S.events.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))
  .forEach(e=>{const ty=tyOf(e);out.push({when:at(e.date,e.start||'08:00'),i:ty.i,c:colr(ty.c),loc:e.loc||'',
   title:ty.name+(e.note?' \u2014 '+e.note:''),sub:dl(P(e.date))+', '+evWhen(e)+' \u00b7 '+e.h+' h'})});
 dueSoon().filter(d=>d.key.charAt(0)!=='e').forEach(d=>out.push(d));
 renDue().forEach(d=>out.push(d));
 return out.sort((a,b)=>a.when-b.when);
}
function owing(){
 const t=ymd(new Date()),due=S.events.filter(e=>!e.paid&&e.date<=t)
  .sort((a,b)=>a.date.localeCompare(b.date));
 const amt=due.reduce((n,e)=>n+payOf(e),0);
 const age=due.length?Math.round((P(t)-P(due[0].date))/864e5):0;
 return{due,amt,age,later:S.events.filter(e=>!e.paid&&e.date>t).length};
}
const paidPill=e=>`<button class="pill ${e.paid?'on':'due'}" data-a="pd" data-id="${e.id}">${
 ic(e.paid?'star':'hourglass')} ${e.paid?'Paid':'Waiting on pay'}</button>`;

/* ---------- dashboard ---------- */
function vDash(){
 const now=new Date(),st=new Date(now);st.setDate(st.getDate()-2);const list=[];
 for(let i=0;i<200;i++){const d=new Date(st);d.setDate(d.getDate()+i);const s=shiftOn(ymd(d));if(s)list.push(s)}
 const cur=list.find(x=>x.st<=now&&now<x.en),nx=list.find(x=>x.st>now);
 /* a block of days off is at least one whole date with no shift on it —
    the 24 hours between a day shift and a night shift is a turnaround, not a day off */
 let gap=null;for(let i=0;i<list.length-1;i++){const a=list[i].en,b=list[i+1].st;
  const d0=P(list[i].date),d1=P(list[i+1].date),n=Math.round((d1-d0)/864e5)-1;
  if(n>=1&&b>now){const f=new Date(d0);f.setDate(f.getDate()+1);
   const l=new Date(d1);l.setDate(l.getDate()-1);gap={a,b,n,f,l};break}}
 const offTxt=g=>`${g.n} day${g.n===1?'':'s'} off · ${dl(g.f)}${g.n>1?' to '+dl(g.l):''}`;
 const desc=s=>`<i class="lg" style="--c:${s.c}">${ic(s.i)}</i> ${esc(s.name)} · ${dl(s.st)}, ${tm(s.st)}–${tm(s.en)}${s.ovr?' (changed)':''}`;
 let h='<h1>Dashboard</h1>';
 if(!nx&&!cur)h+=`<div class="card"><h2>No shifts yet</h2><p class="mu">Set up your rotation to start the countdowns.</p>
  <button class="btn" data-a="goto" data-t2="rot" data-s="rot">Set up rotation</button></div>`;
 else{
  const onOff=!cur&&gap&&gap.a<=now;
  if(onOff){
   /* on days off, "next shift" and "back on shift" are the same moment — say it once */
   h+=`<div class="card"><h2>On days off — back on shift in</h2>
    ${boxes(gap.b-now)}<span class="mu">${offTxt(gap)}</span><br><span class="mu">${desc(nx)}</span></div>`;
  }else{
   h+=`<div class="card"><h2>${cur?'On shift now, ends in':'Next shift starts in'}</h2>
    ${boxes(cur?cur.en-now:nx.st-now)}<span class="mu">${desc(cur||nx)}</span></div>`;
   if(gap)h+=`<div class="card"><h2>Days off start in</h2>
    ${boxes(gap.a-now)}<span class="mu">${offTxt(gap)}</span></div>`;
  }
 }
 if(hasPaydays()){let np=null;const q=new Date(now.getFullYear(),now.getMonth(),now.getDate()),q0=new Date(q);
  for(let i=0;i<40;i++){if(isPay(ymd(q))){np=new Date(q);break}q.setDate(q.getDate()+1)}
  if(np){const n=Math.round((np-q0)/864e5);
   h+=`<div class="card"><h2>Next payday</h2><div class="big">${n===0?'Today':dl(np)}</div>
   <p class="sub">${n===0?dl(np,{weekday:'long',month:'long',day:'numeric'}):n===1?'Tomorrow':'In '+n+' days'}</p></div>`}}
 const ow=owing();
 if(ow.due.length)h+=`<div class="card"><h2>Waiting to be paid</h2>
  <div class="big">${$$(ow.amt)}</div>
  <p class="sub">${ow.due.length} entr${ow.due.length===1?'y':'ies'} not marked paid \u00b7 oldest ${ow.age===0?'today':ow.age+' day'+(ow.age===1?'':'s')+' ago'}</p>
  <details data-fold="dashwait"${OPEN.dashwait?' open':''}><summary>Show the ${ow.due.length} entr${ow.due.length===1?'y':'ies'}</summary>
   ${ow.due.slice(0,30).map(e=>{const t=tyOf(e);return`<div class="ev" style="--c:${colr(t.c)}">
    <div class="ic">${ic(t.i)}</div><div class="t"><b>${esc(t.name)}</b><br>
    <span class="mu">${dl(P(e.date))} \u00b7 ${e.h} h${e.note?' \u00b7 '+esc(e.note):''}</span></div>
    <b>${$$(payOf(e))}</b></div>
    <div style="margin:-2px 0 2px 50px">${paidPill(e)}</div>`}).join('')}
   ${ow.due.length>30?`<p class="mu" style="margin:6px 0 0">and ${ow.due.length-30} more \u2014 all of them are on the Pay tab.</p>`:''}
   <p class="mu" style="margin:6px 0 0">Tap a badge once it's paid.</p></details></div>`;
 const lv=leaveRows(now.getFullYear(),true);
 if(lv)h+=`<div class="card"><h2>Time off left</h2>${lv}</div>`;
 else if(Object.keys(S.ov).some(d=>String(d).slice(0,4)===String(now.getFullYear())&&S.ov[d].k==='off'))
  h+=`<div class="card"><h2>Time off</h2>
  <p class="mu" style="margin:0">Set how much you get a year and this shows what you have left.</p>
  <div class="chips"><button class="btn ghost sm" data-a="goto" data-t2="pay" data-p="bank">Set my allowance</button></div></div>`;
 const ah=aheadList(),show=ah.slice(0,10),more=ah.length-show.length;
 h+=`<div class="card"><h2>What's ahead</h2>${show.length?show.map(d=>
  `<div class="ev" style="--c:${d.c}"><div class="ic">${ic(d.i)}</div>
  <div class="t"><b>${esc(d.title)}</b><br><span class="mu">${esc(d.sub)} \u00b7 ${relT(d.when,now)}</span>${mapLink(d.loc)}</div></div>`).join('')
  :'<p class="mu" style="margin:0">Nothing booked yet.</p>'}
  ${more?`<div class="chips"><button class="btn ghost sm" data-a="goto" data-t2="cal" data-c="agenda">${more} more ahead \u2014 open the agenda</button></div>`:''}
  <p class="mu" style="margin:8px 0 0">Everything you have booked from today on, plus renewals and the reminders you set. For alerts when the app is shut, export your shifts to your phone's calendar.</p></div>`;
 return h;
}

/* ---------- pay ---------- */
function ovl(x,w){let m=0;for(let k=-1;k<=1;k++){const d=P(x.date);d.setDate(d.getDate()+k);
 const s=ymd(d),a=at(s,w.from);let b=at(s,w.to);if(b<=a)b.setDate(b.getDate()+1);
 m+=Math.max(0,Math.min(x.en,b)-Math.max(x.st,a))}return m/36e5}
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const entSpan=e=>{const st=at(e.date,e.start||'08:00');return{date:e.date,st,en:new Date(st.getTime()+num(e.h)*36e5)}};
const evEnd=e=>tm(entSpan(e).en);
const evWhen=e=>esc(e.start||'')+'–'+evEnd(e);
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));
 const n=v/e;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}
function payYears(){
 const ys=new Set([new Date().getFullYear()]);
 S.events.forEach(e=>ys.add(+String(e.date).slice(0,4)));
 Object.keys(S.ov).forEach(d=>ys.add(+String(d).slice(0,4)));
 return [...ys].filter(y=>y>2000&&y<2200).sort();
}
/* only what's known: the calendar, and the extra work the person logged themselves */
function payCalc(y,upto){
 const now=new Date(),cur=y===now.getFullYear();
 const cap=upto?at(upto,'23:59'):(cur?now:new Date(y+1,0,1));
 const capD=ymd(cap);
 let hh=0,wh=0,shifts=0,nights=0,wknd=0,offD=0,run=0,best=0,pdn=0;
 for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1)){
  const sd=ymd(d);
  if(hasPaydays()&&isPay(sd)&&sd<=capD)pdn++;
  const o=S.ov[sd];if(o&&o.k==='off')offD++;
  const x=shiftOn(sd);
  if(!x){run=0;continue}
  if(x.en<=cap||(!cur&&x.st<cap)){
   wh+=x.h;shifts++;run++;if(run>best)best=run;
   if(ovl(x,NIGHTW)>0)nights++;
   const dw=x.st.getDay();if(dw===0||dw===6)wknd++;
   if(isHol(sd))hh+=x.h;
  }else run=0;
 }
 const ye=S.events.filter(e=>String(e.date).slice(0,4)===String(y));
 const done=ye.filter(e=>e.date<=capD);

 let got=false;for(let i=0;i<40;i++){if(isPay(ymd(start))){got=true;break}start.setDate(start.getDate()-1)}
 if(got)start.setDate(start.getDate()+1);

function icsText(){
 const z=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'
  +pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shift Planner//EN','CALSCALE:GREGORIAN'];
 const now=new Date(),from=new Date(now.getFullYear(),0,1);
 for(let i=0;i<730;i++){const d=new Date(from);d.setDate(d.getDate()+i);
  const s=ymd(d),x=shiftOn(s);if(!x)continue;
  const nt=noteTxt(s).join(' · ');
  const sdef=shiftDef(S.rot.shifts,x.id),srem=num(sdef&&sdef.rem);
  L.push('BEGIN:VEVENT','UID:sh-'+s+'-'+x.id+'@shiftplanner','DTSTAMP:'+z(now),
   'DTSTART:'+z(x.st),'DTEND:'+z(x.en),'SUMMARY:'+x.name+(x.ovr?' (changed)':''));
  if(nt)L.push('DESCRIPTION:'+String(nt).replace(/[,;\\]/g,' '));
  if(srem>0)L.push('BEGIN:VALARM','TRIGGER:-PT'+srem+'M','ACTION:DISPLAY',
   'DESCRIPTION:'+x.name+' shift '+leadTxt(srem).replace(' before',''),'END:VALARM');
  L.push('END:VEVENT');}
 S.events.forEach(e=>{const t=tyOf(e),st=at(e.date,e.start);
  const en=new Date(st.getTime()+num(e.h)*36e5),rem=num(t.rem);
  L.push('BEGIN:VEVENT','UID:ev-'+e.id+'@shiftplanner','DTSTAMP:'+z(now),
   'DTSTART:'+z(st),'DTEND:'+z(en),
   'SUMMARY:'+icsEsc(t.name+(e.note?' \u2014 '+e.note:'')));
  if(e.loc)L.push('LOCATION:'+icsEsc(e.loc));
  if(rem>0)L.push('BEGIN:VALARM','TRIGGER:-PT'+rem+'M','ACTION:DISPLAY',
   'DESCRIPTION:'+t.name+' '+leadTxt(rem).replace(' before',''),'END:VALARM');
  L.push('END:VEVENT')});
 (S.ren||[]).forEach(r=>{const st=at(r.date,'09:00'),en=at(r.date,'10:00'),lead=(num(r.rem)||60)*1440;
  L.push('BEGIN:VEVENT','UID:rn-'+r.id+'@shiftplanner','DTSTAMP:'+z(now),
   'DTSTART:'+z(st),'DTEND:'+z(en),'SUMMARY:'+icsEsc(r.name+' expires'),
   'BEGIN:VALARM','TRIGGER:-PT'+lead+'M','ACTION:DISPLAY',
   'DESCRIPTION:'+icsEsc(r.name+' expires in '+(num(r.rem)||60)+' days'),'END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');
 const fold=l=>{if(l.length<=73)return l;const parts=[l.slice(0,73)];
  for(let k=73;k<l.length;k+=72)parts.push(' '+l.slice(k,k+72));return parts.join('\r\n')};
 return L.map(fold).join('\r\n');
}

const SMALLW=new Set(['a','an','the','and','but','or','nor','for','so','yet','as','at','by','in','of','on','per','to','via','vs','with','from','into','onto']);
function tcWords(s,first,last){
 return s.replace(/[A-Za-z][A-Za-z'\u2019]*/g,(w,i,str)=>{
  const isFirst=first&&!/[A-Za-z0-9]/.test(str.slice(0,i)),isLast=last&&!/[A-Za-z0-9]/.test(str.slice(i+w.length));
  if(/[A-Z]/.test(w.slice(1)))return w;                      /* MCU, iPhone: leave as typed */
  const lw=w.toLowerCase();
  if(!isFirst&&!isLast&&SMALLW.has(lw)&&str.charAt(i-1)!=='-')return lw;
  return w.charAt(0).toUpperCase()+w.slice(1)})}

 const rem=(data,dv)=>{const r=dv.map(()=>0);
  for(const b of data){const f=b^r.shift();r.push(0);dv.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};

  step=Math.floor((v*8+n*3+5)/(n*4-4))*2,r=[6];for(let p=v*4+10;r.length<n;p-=step)r.splice(1,0,p);return r};

  (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
  (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];

  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));

   const e=rem(d,dv);if(i<ns)d.push(0);blocks.push(d.concat(e))}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-ec||j>=ns)cw.push(b[i])});
  /* draw */
  const n=v*4+17,M=[],F=[];for(let y=0;y<n;y++){M.push(new Array(n).fill(false));F.push(new Array(n).fill(false))}
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  [[3,3],[n-4,3],[3,n-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
   const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<n&&y>=0&&y<n)set(x,y,d!==2&&d!==4)}});

   for(let x=0;x<n;x++){let run=1;for(let y=1;y<=n;y++){if(y<n&&G[y][x]===G[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
   for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=G[y][x];if(c===G[y][x+1]&&c===G[y+1][x]&&c===G[y+1][x+1])p+=3}
   let dark=0;G.forEach(r=>r.forEach(c=>{if(c)dark++}));
   p+=Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10;return p};
  let best=null,bs=1e9;
  for(let m=0;m<8;m++){const G=M.map((r,y)=>r.map((c,x)=>F[y][x]?c:c!==MASK[m](x,y)));
   const Fs=F;const saveM=M.map(r=>r.slice());

   for(let y=0;y<n;y++)for(let x=0;x<n;x++)M[y][x]=G[y][x];fmt(m);
   const s=score(M);if(s<bs){bs=s;best=M.map(r=>r.slice())}
   for(let y=0;y<n;y++)for(let x=0;x<n;x++)M[y][x]=saveM[y][x]}

 function svg(text,px){const G=make(text),n=G.length,q=4,w=n+q*2;let d='';
  G.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
